---
- name: Dotfiles | Validate common variables
  ansible.builtin.assert:
    that:
      - dotfiles_owner is string or dotfiles_owner is number
      - dotfiles_group is string or dotfiles_group is number
      - dotfiles_directory_mode is string
      - dotfiles_home != "/"
      - dotfiles_nvim_restore_cron_enabled is boolean
      - dotfiles_cron_path is string
      - dotfiles_cron_path | length > 0
      - dotfiles_nvim_restore_cron_name is string
      - dotfiles_nvim_restore_cron_name | length > 0
      - dotfiles_nvim_restore_cron_job is string
      - dotfiles_nvim_restore_cron_job | length > 0
      - dotfiles_legacy_cron_names is sequence
      - dotfiles_legacy_cron_names is not string
      - dotfiles_directories is sequence
      - dotfiles_directories is not string
      - dotfiles_mapping is sequence
      - dotfiles_mapping is not string
      - dotfiles_baseline_files is sequence
      - dotfiles_baseline_files is not string
      - dotfiles_cleanup_paths is sequence
      - dotfiles_cleanup_paths is not string
    fail_msg: "dotfiles role variables are invalid."
    quiet: true
  tags:
    - configs

- name: Dotfiles | Validate path variables
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', dotfiles_path) is string
      - lookup('ansible.builtin.vars', dotfiles_path) is regex('^/')
    fail_msg: "Invalid dotfiles path variable {{ dotfiles_path }}={{ lookup('ansible.builtin.vars', dotfiles_path) }}"
    quiet: true
  loop:
    - dotfiles_home
    - dotfiles_location
    - dotfiles_config_dir
    - dotfiles_bashrc_dir
    - dotfiles_gnupg_dir
    - dotfiles_ssh_dir
    - dotfiles_ssh_config_dir
    - dotfiles_crontab_path
    - dotfiles_flock_path
    - dotfiles_nvim_path
    - dotfiles_pam_environment_path
    - dotfiles_nvim_state_dir
    - dotfiles_nvim_restore_log_path
    - dotfiles_nvim_restore_lock_path
  loop_control:
    loop_var: dotfiles_path
    label: "{{ dotfiles_path }}"
  tags:
    - configs

- name: Dotfiles | Validate extra directories
  ansible.builtin.assert:
    that:
      - dotfiles_directory is mapping
      - dotfiles_directory.path is defined
      - dotfiles_directory.path is string
      - dotfiles_directory.path is regex('^/')
      - dotfiles_directory_relative_path != "."
      - dotfiles_directory_relative_path is not regex('^\.\.(/|$)')
      - >-
        [dotfiles_home, dotfiles_directory_relative_path] | path_join
        == dotfiles_directory.path
      - dotfiles_directory.mode is not defined or dotfiles_directory.mode is string
      - >-
        dotfiles_directory.owner is not defined
        or dotfiles_directory.owner is string
        or dotfiles_directory.owner is number
      - >-
        dotfiles_directory.group is not defined
        or dotfiles_directory.group is string
        or dotfiles_directory.group is number
    fail_msg: "Invalid dotfiles directory entry: {{ dotfiles_directory | to_nice_json }}"
    quiet: true
  vars:
    dotfiles_directory_relative_path: >-
      {{ dotfiles_directory.path | relpath(dotfiles_home) }}
  loop: "{{ dotfiles_directories }}"
  loop_control:
    loop_var: dotfiles_directory
    label: "{{ dotfiles_directory.path | default('invalid directory entry') }}"
  tags:
    - configs

- name: Dotfiles | Validate link mappings
  ansible.builtin.assert:
    that:
      - dotfiles_link is mapping
      - dotfiles_link.name is defined
      - dotfiles_link.name is string
      - dotfiles_link.name is regex('^[a-z0-9_]+$')
      - dotfiles_link.payload is defined
      - dotfiles_link.payload is string
      - dotfiles_link.payload | length > 0
      - dotfiles_link.payload is not regex('^/')
      - dotfiles_link.payload is not regex('(^|/)\\.\\.(/|$)')
      - dotfiles_link.dest is defined
      - dotfiles_link.dest is string
      - dotfiles_link.dest is regex('^/')
      - dotfiles_link_relative_dest != "."
      - dotfiles_link_relative_dest is not regex('^\.\.(/|$)')
      - >-
        [dotfiles_home, dotfiles_link_relative_dest] | path_join
        == dotfiles_link.dest
    fail_msg: "Invalid dotfiles mapping entry: {{ dotfiles_link | to_nice_json }}"
    quiet: true
  vars:
    dotfiles_link_relative_dest: >-
      {{ dotfiles_link.dest | relpath(dotfiles_home) }}
  loop: "{{ dotfiles_mapping }}"
  loop_control:
    loop_var: dotfiles_link
    label: "{{ dotfiles_link.name | default('invalid link mapping') }}"
  tags:
    - configs

- name: Dotfiles | Validate baseline files
  ansible.builtin.assert:
    that:
      - dotfiles_baseline_file is mapping
      - dotfiles_baseline_file.name is defined
      - dotfiles_baseline_file.name is string
      - dotfiles_baseline_file.name is regex('^[a-z0-9_]+$')
      - dotfiles_baseline_file.payload is defined
      - dotfiles_baseline_file.payload is string
      - dotfiles_baseline_file.payload | length > 0
      - dotfiles_baseline_file.payload is not regex('^/')
      - dotfiles_baseline_file.payload is not regex('(^|/)\\.\\.(/|$)')
      - dotfiles_baseline_file.dest is defined
      - dotfiles_baseline_file.dest is string
      - dotfiles_baseline_file.dest is regex('^/')
      - dotfiles_baseline_relative_dest != "."
      - dotfiles_baseline_relative_dest is not regex('^\\.\\.(/|$)')
      - >-
        [dotfiles_home, dotfiles_baseline_relative_dest] | path_join
        == dotfiles_baseline_file.dest
      - dotfiles_baseline_file.mode is not defined or dotfiles_baseline_file.mode is string
    fail_msg: "Invalid dotfiles baseline file: {{ dotfiles_baseline_file | to_nice_json }}"
    quiet: true
  vars:
    dotfiles_baseline_relative_dest: >-
      {{ dotfiles_baseline_file.dest | relpath(dotfiles_home) }}
  loop: "{{ dotfiles_baseline_files }}"
  loop_control:
    loop_var: dotfiles_baseline_file
    label: "{{ dotfiles_baseline_file.name | default('invalid baseline file') }}"
  tags:
    - configs

- name: Dotfiles | Validate destination boundaries
  ansible.builtin.assert:
    that:
      - >-
        (dotfiles_mapping + dotfiles_baseline_files)
        | rejectattr('dest', 'equalto', dotfiles_managed_entry.dest)
        | map(attribute='dest')
        | select(
            'match',
            '^' ~ (dotfiles_managed_entry.dest | regex_escape) ~ '/'
          )
        | list
        | length == 0
    fail_msg: "Overlapping dotfiles destination: {{ dotfiles_managed_entry.dest }}"
    quiet: true
  loop: "{{ dotfiles_mapping + dotfiles_baseline_files }}"
  loop_control:
    loop_var: dotfiles_managed_entry
    label: "{{ dotfiles_managed_entry.name }}"
  tags:
    - configs

- name: Dotfiles | Validate mapping uniqueness
  ansible.builtin.assert:
    that:
      - >-
        dotfiles_mapping | map(attribute='name') | list | length
        == dotfiles_mapping | map(attribute='name') | unique | list | length
      - >-
        dotfiles_mapping | map(attribute='dest') | list | length
        == dotfiles_mapping | map(attribute='dest') | unique | list | length
      - >-
        dotfiles_baseline_files | map(attribute='name') | list | length
        == dotfiles_baseline_files | map(attribute='name') | unique | list | length
      - >-
        dotfiles_baseline_files | map(attribute='dest') | list | length
        == dotfiles_baseline_files | map(attribute='dest') | unique | list | length
      - >-
        (dotfiles_mapping + dotfiles_baseline_files)
        | map(attribute='dest') | list | length
        == (dotfiles_mapping + dotfiles_baseline_files)
        | map(attribute='dest') | unique | list | length
      - >-
        dotfiles_cleanup_paths | length
        == dotfiles_cleanup_paths | unique | list | length
    fail_msg: "dotfiles mapping, baseline files, and cleanup paths must be unique."
    quiet: true
  tags:
    - configs

- name: Dotfiles | Validate cleanup paths
  ansible.builtin.assert:
    that:
      - dotfiles_cleanup_path is string
      - dotfiles_cleanup_path is regex('^/')
      - dotfiles_cleanup_relative_path != "."
      - dotfiles_cleanup_relative_path is not regex('^\.\.(/|$)')
      - >-
        [dotfiles_home, dotfiles_cleanup_relative_path] | path_join
        == dotfiles_cleanup_path
      - >-
        (dotfiles_mapping + dotfiles_baseline_files)
        | map(attribute='dest')
        | select(
            'match',
            '^' ~ (dotfiles_cleanup_path | regex_escape) ~ '(/|$)'
          )
        | list
        | length == 0
      - >-
        (dotfiles_mapping + dotfiles_baseline_files) | length == 0
        or dotfiles_cleanup_path is not regex(
          '^(?:' ~ dotfiles_managed_destination_pattern ~ ')(/|$)'
        )
    fail_msg: "Invalid dotfiles cleanup path: {{ dotfiles_cleanup_path }}"
    quiet: true
  vars:
    dotfiles_cleanup_relative_path: >-
      {{ dotfiles_cleanup_path | relpath(dotfiles_home) }}
    dotfiles_managed_destination_pattern: >-
      {{
        (dotfiles_mapping + dotfiles_baseline_files)
        | map(attribute='dest')
        | map('regex_escape')
        | join('|')
      }}
  loop: "{{ dotfiles_cleanup_paths }}"
  loop_control:
    loop_var: dotfiles_cleanup_path
    label: "{{ dotfiles_cleanup_path }}"
  tags:
    - configs
