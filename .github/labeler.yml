---
# Apply every matching area; arbitrary file/label limits silently skip broad PRs.

ai-instructions:
  - changed-files:
      - any-glob-to-any-file:
          - "AGENTS.md"
          - "**/AGENTS.md"
          - "CLAUDE.md"
          - "GEMINI.md"
          - ".agents/**/*"
          - ".claude/**/*"
          - ".github/copilot-instructions.md"
          - ".github/instructions/**/*"
          - "dotfiles/.agents/**/*"
          - "dotfiles/.codex/**/*"
          - "dotfiles/.gemini/settings.json"

ansible:
  - changed-files:
      - any-glob-to-any-file:
          - "ansible.cfg"
          - "requirements.yml"
          - "playbook_*.yml"
          - "inventory/**/*"
          - "roles/**/*"

automation:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"
          - ".commitlintrc.yaml"
          - ".pre-commit-config.yaml"
          - ".release-please-manifest.json"
          - ".zizmor.yml"
          - "release-please-config.json"
          - "renovate.json"
          - "Taskfile.yml"

browser-policies:
  - changed-files:
      - any-glob-to-any-file:
          - "playbook_browser_policies.yml"
          - "roles/browser_policies/**/*"
          - "inventory/host_vars/this_host/browser_policies.yml"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**/*"
          - ".github/actions/**/*"
          - ".github/tools/**/*"
          - ".github/linters/**/*"
          - ".github/super-linter.env"
          - ".pre-commit-config.yaml"
          - ".markdownlint-cli2.yaml"
          - "dotfiles/.yamllint"
          - "Taskfile.yml"
          - ".ruff.toml"
          - ".zizmor.yml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".pre-commit-config.yaml"
          - ".github/tools/**/package*.json"
          - "dotfiles/.config/nvim/lazy-lock.json"
          - "dotfiles/.local/share/codex-cli/**/package*.json"
          - "dotfiles/.local/share/codex-mcp/**/package*.json"
          - "pyproject.toml"
          - "requirements.yml"
          - "renovate.json"
          - "uv.lock"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**/*"

dotfiles:
  - changed-files:
      - any-glob-to-any-file:
          - "dotfiles/**/*"
          - "inventory/host_vars/this_host/dotfiles.yml"
          - "playbook_install.yml"
          - "roles/dotfiles/**/*"

github:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"

inventory:
  - changed-files:
      - any-glob-to-any-file:
          - "inventory/**/*"

nvim:
  - changed-files:
      - any-glob-to-any-file:
          - "dotfiles/.config/nvim/**/*"
          - ".test/nvim/**/*"
          - ".test/test_update_nvim.py"
          - ".github/scripts/update_nvim.lua"
          - "docs/nvim-keymaps.md"

security:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/CODEOWNERS"
          - "dotfiles/.codex/hooks/**/*"
          - "dotfiles/.config/k9s/**/*"
          - "dotfiles/.config/pip/**/*"
          - "dotfiles/.gemini/**/*"
          - "dotfiles/.gnupg/**/*"
          - "dotfiles/.ssh/**/*"
          - "dotfiles/.npmrc"
          - "dotfiles/.terraformrc"
          - "dotfiles/.yarnrc"
          - "inventory/host_vars/this_host/security.yml"
          - "inventory/host_vars/this_host/browser_policies.yml"
          - "roles/browser_policies/**/*"
          - "roles/system/defaults/main.yml"
          - "roles/system/tasks/sys-limits.yml"
          - "roles/system/tasks/sys-sshd.yml"
          - "roles/system/tasks/sys-sysctl.yml"
          - "roles/system/templates/limits-dropin.conf.j2"
          - "roles/system/templates/dropin-sshd.conf.j2"
          - "roles/system/templates/sysctl-dropin.conf.j2"

shell:
  - changed-files:
      - any-glob-to-any-file:
          - "dotfiles/.bash_profile"
          - "dotfiles/.bashrc"
          - ".test/**/*.sh"

system:
  - changed-files:
      - any-glob-to-any-file:
          - "playbook_system.yml"
          - "roles/system/**/*"
          - "inventory/host_vars/this_host/system.yml"
          - "inventory/host_vars/this_host/security.yml"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - ".test/**/*"
