name: PR title

permissions:
  contents: read

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/tools/commitlint/package-lock.json

      - name: Install locked commitlint dependencies
        working-directory: .github/tools/commitlint
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate the squash commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          export NODE_PATH="${GITHUB_WORKSPACE}/.github/tools/commitlint/node_modules"
          printf '%s\n' "${PR_TITLE}" |
            .github/tools/commitlint/node_modules/.bin/commitlint --config .commitlintrc.yaml --strict
