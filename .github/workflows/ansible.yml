name: ansible

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly run against fresh Arch to catch rolling-release upstream breakage.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_contracts:
    name: python-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Run Python validation
        id: python_tests
        run: |
          set -o pipefail
          {
            uv sync --locked --no-build --no-install-project --no-dev
            export UV_NO_SYNC=true
            task lint:python
            task test:python
          } 2>&1 | tee "${RUNNER_TEMP}/python-contracts.log"

      - name: Summarize Python contract tests
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.python_tests.outcome }}
        run: |
          {
            printf '## Python contract tests\n\n'
            printf "Result: \`%s\`\n\n" "${TEST_OUTCOME}"
            printf '```text\n'
            if [ -f "${RUNNER_TEMP}/python-contracts.log" ]; then
              tail -n 100 "${RUNNER_TEMP}/python-contracts.log"
            else
              printf '%s\n' 'The test command did not produce a log.'
            fi
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  ansible_lint:
    name: ansible-lint
    uses: tenhishadow/github_actions_templates/.github/workflows/taskfile.uv.yaml@39bafe28cfa188344b842194b575ecef42e2059d # renovate: branch=main
    with:
      os: ubuntu-latest
      task_target: lint

  ansible_exec:
    name: ansible-exec (${{ matrix.os }})
    # The weekly schedule targets the Arch container; skip the cross-OS apply
    # matrix to keep scheduled runs lean.
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    uses: tenhishadow/github_actions_templates/.github/workflows/taskfile.uv.yaml@39bafe28cfa188344b842194b575ecef42e2059d # renovate: branch=main
    with:
      os: ${{ matrix.os }}
      task_target: default

  repository_contract:
    name: repository-contract (archlinux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: archlinux:multilib-devel
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/dotfiles-contract-venv
    steps:
      - name: Install validation tools
        run: >-
          pacman --disable-sandbox -Syu
          --noconfirm
          --needed
          --noprogressbar
          actionlint
          git
          go-task
          neovim
          nodejs-lts-krypton
          npm
          openssh
          pre-commit
          stylua
          tree-sitter-cli
          uv

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Resolve validation runtime
        id: runtime
        run: >-
          printf 'python=%s\n'
          "$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          >> "${GITHUB_OUTPUT}"

      - name: Restore validation caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cache/pre-commit
            /github/home/.cache/uv
            /github/home/.npm/_cacache
          key: repository-contract-${{ runner.os }}-archlinux-py${{ steps.runtime.outputs.python }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock', 'Taskfile.yml') }}
          restore-keys: |
            repository-contract-${{ runner.os }}-archlinux-py${{ steps.runtime.outputs.python }}-

      - name: Validate repository contract
        run: go-task verify:fast

      - name: Run Neovim smoke tests
        env:
          NVIM_TS_INSTALL: required
        run: go-task test:nvim

  workstation_convergence:
    name: workstation-convergence (archlinux)
    needs: python_contracts
    runs-on: ubuntu-latest
    container:
      image: archlinux:multilib-devel
    steps:
      - name: Install checkout dependency
        run: >-
          pacman --disable-sandbox -Syu
          --noconfirm
          --needed
          --noprogressbar
          git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workstation convergence
        run: ./.test/system/exec.sh
