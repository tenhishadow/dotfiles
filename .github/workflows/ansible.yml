name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    # Validate rolling Arch dependencies even when repository files do not change.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nvim: ${{ steps.changes.outputs.nvim }}
      system: ${{ steps.changes.outputs.system }}
      user: ${{ steps.changes.outputs.user }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the PR title before repository checks
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/pr-title

      - name: Select affected integration checks
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.repository.default_branch }}
          predicate-quantifier: some-with-excludes
          filters: |
            shared: &shared
              - '.github/workflows/ansible.yml'
              - '.github/actions/**'
              - 'Taskfile.yml'
              - 'ansible.cfg'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements.yml'
            nvim:
              - *shared
              - 'dotfiles/.config/nvim/**'
              - '.test/nvim/**'
              - '.github/scripts/**/*.lua'
              - '.test/test_update_nvim.py'
              - 'docs/nvim-keymaps.md'
              - '.stylua.toml'
              - '!**/AGENTS.md'
            system:
              - *shared
              - 'roles/**'
              - 'inventory/**'
              - 'playbook_*.yml'
              - 'dotfiles/**'
              - '.test/system/**'
              - '.test/assert_ansible_convergence.py'
              - '!**/*.md'
            user:
              - *shared
              - 'roles/dotfiles/**'
              - 'inventory/hosts.yml'
              - 'inventory/host_vars/this_host/dotfiles.yml'
              - 'playbook_install.yml'
              - 'dotfiles/**'
              - '!**/*.md'
            renovate:
              - 'renovate.json'
              - 'Taskfile.yml'
              - '.github/workflows/ansible.yml'
              - '.github/actions/**'

      - name: Set up validation tools
        uses: ./.github/actions/setup

      - name: Restore pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run static checks once
        run: task ci:static

      - name: Set up Node.js for Renovate validation
        # The PR title action already prepared Node.js for pull requests.
        if: github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.renovate == 'true')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate Renovate configuration
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.renovate == 'true'
        run: task renovate

  super_linter:
    name: github-super-linter
    needs: static
    uses: ./.github/workflows/github-super-linter.yml

  ansible_exec:
    name: ansible-exec (${{ matrix.os }})
    needs: [static, super_linter]
    if: github.event_name != 'schedule' && (github.event_name == 'workflow_dispatch' || needs.static.outputs.user == 'true')
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up validation tools
        uses: ./.github/actions/setup

      - name: Apply user-level dotfiles on the disposable runner
        run: task default

  nvim:
    name: neovim (archlinux)
    needs: [static, super_linter]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.static.outputs.nvim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:multilib-devel
    steps:
      - name: Install Neovim validation tools
        run: >-
          pacman --disable-sandbox -Syu
          --noconfirm
          --needed
          --noprogressbar
          git
          markdownlint-cli2
          neovim
          nodejs-lts-krypton
          npm
          openssh
          python
          stylua
          tree-sitter-cli

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked validation tools
        uses: ./.github/actions/setup

      - name: Check Lua formatting and keymap documentation
        run: task stylua docs:nvim-keymaps:check

      - name: Test Neovim dependency upgrade failure handling
        run: task test:python -- .test/test_update_nvim.py

      - name: Run Neovim smoke and compatibility tests
        env:
          NVIM_TS_INSTALL: required
        run: task test:nvim:all

  workstation_convergence:
    name: workstation-convergence (archlinux)
    needs: [static, super_linter]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.static.outputs.system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:multilib-devel
    steps:
      - name: Install checkout dependency
        run: >-
          pacman --disable-sandbox -Syu
          --noconfirm
          --needed
          --noprogressbar
          git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workstation convergence
        run: ./.test/system/exec.sh

  ci:
    name: ci
    if: always()
    needs: [static, super_linter, ansible_exec, nvim, workstation_convergence]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful checks or deliberate skips
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ['RESULTS'])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          failed = [name for name, job in results.items()
                    if job['result'] not in {'success', 'skipped'}]
          required = ('static', 'super_linter')
          if any(results[name]['result'] != 'success' for name in required) or failed:
              sys.exit('CI checks did not complete successfully.')
          PY

  copilot_review:
    needs: ci
    if: >-
      !cancelled() && needs.ci.result == 'success' &&
      vars.COPILOT_REVIEW_ENABLED == 'true' &&
      github.event_name == 'pull_request'
    permissions:
      actions: read
      pull-requests: read
    # The reusable workflow owns eligibility checks before allocating a runner.
    uses: ./.github/workflows/copilot-review.yml
    with:
      validated-head: ${{ github.event.pull_request.head.sha }}
    secrets:
      COPILOT_REVIEW_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
