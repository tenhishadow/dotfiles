name: ansible

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly run against fresh Arch to catch rolling-release upstream breakage.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible_lint:
    name: ansible-lint
    uses: tenhishadow/github_actions_templates/.github/workflows/taskfile.uv.yaml@39bafe28cfa188344b842194b575ecef42e2059d # main
    with:
      os: ubuntu-latest
      task_target: lint

  ansible_exec:
    name: ansible-exec (${{ matrix.os }})
    # The weekly schedule targets the Arch container; skip the cross-OS apply
    # matrix to keep scheduled runs lean.
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    uses: tenhishadow/github_actions_templates/.github/workflows/taskfile.uv.yaml@39bafe28cfa188344b842194b575ecef42e2059d # main
    with:
      os: ${{ matrix.os }}
      task_target: default

  repository_contract:
    name: repository-contract (archlinux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: archlinux:multilib-devel
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/dotfiles-contract-venv
    steps:
      - name: Install validation tools
        run: >-
          pacman --disable-sandbox -Syu
          --noconfirm
          --needed
          --noprogressbar
          actionlint
          git
          go-task
          neovim
          nodejs
          npm
          pre-commit
          stylua
          uv

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Validate repository contract
        run: go-task verify:fast

  workstation_convergence:
    name: workstation-convergence (archlinux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:multilib-devel
    steps:
      - name: Install checkout dependency
        run: >-
          pacman --disable-sandbox -Syu
          --noconfirm
          --needed
          --noprogressbar
          git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify workstation convergence
        run: ./.test/system/exec.sh
