# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

set: [pipefail]

vars:
  RUN_PLAYBOOK: "uv run ansible-playbook playbook_install.yml {{.CLI_ARGS}}"
  RUN_SYSTEM_PLAYBOOK: "uv run ansible-playbook playbook_system.yml --diff {{.CLI_ARGS}}"
  RUN_BROWSER_PLAYBOOK: "uv run ansible-playbook playbook_browser_policies.yml"
  VINT_TARGETS: "dotfiles/.vimrc dotfiles/.config/nvim"
  STYLUA_TARGETS: "dotfiles/.config/nvim .test/nvim .github/scripts"
  RENOVATE_VERSION: "44.125.1"
  RENOVATE_NODE_MIN_VERSION: "24.11.0"
  PINACT_VERSION: "v5.0.0"
  DEPENDENCY_AUTH_TIMEOUT: "30s"
  DEPENDENCY_COMMAND_TIMEOUT: "600s"
  NVIM_TEST_ENV: >-
    env
    HOME="${PWD}/.test/nvim/.home"
    XDG_CONFIG_HOME="${PWD}/.test/nvim/.config"
    XDG_DATA_HOME="${PWD}/.test/nvim/.data"
    XDG_STATE_HOME="${PWD}/.test/nvim/.state"
    XDG_CACHE_HOME="${PWD}/.test/nvim/.cache"
    GOENV="${PWD}/.test/nvim/.state/go/env"
    NVIM_USE_MASON=off
  NVIM_SMOKE_ENV: >-
    {{.NVIM_TEST_ENV}}
    NVIM_TS_INSTALL={{default "auto" .NVIM_TS_INSTALL | shellQuote}}
    NVIM_TS_TIMEOUT_MS=120000
  SUPERLINTER_IMAGE_TAG: "slim-v8.7.0"

tasks:
  deps-os:
    desc: Check the tools required by the user-level workflow.
    run: once
    preconditions:
      - sh: command -v uv >/dev/null 2>&1
        msg: uv is required; install it before running the user-level workflow.
      - sh: command -v git >/dev/null 2>&1
        msg: git is required; install it before running the user-level workflow.
  deps-os-system:
    desc: Check privilege escalation support for opt-in system work.
    run: once
    deps: [deps-os]
    preconditions:
      - sh: '[ "$(id -u)" -eq 0 ] || command -v sudo >/dev/null 2>&1'
        msg: sudo is required for the privileged workstation workflow.
  deps-python:
    desc: Install the locked Python environment once per invocation.
    run: once
    silent: true
    deps: [deps-os]
    cmd: >-
      if [ "${UV_NO_SYNC:-false}" != "true" ]; then
        uv sync --locked --no-build --no-install-project --no-dev --managed-python --quiet;
      fi
  deps-galaxy:
    desc: Install the declared Ansible collections once per invocation.
    run: once
    silent: true
    deps: [deps-python]
    cmd: "uv run ansible-galaxy install -r requirements.yml"
  deps-verify:
    desc: Check tools required by the full static validation aggregate.
    run: once
    deps: [deps-python]
    cmds:
      - >-
        for tool in npx stylua nvim; do
          command -v "${tool}" >/dev/null 2>&1 || {
            printf '%s\n' "${tool} is required for repository validation." >&2;
            exit 1;
          };
        done
      - "uv run pre-commit --version >/dev/null"
  deps-renovate:
    desc: Check the Node.js runtime required by pinned Renovate.
    run: once
    preconditions:
      - sh: command -v node >/dev/null 2>&1 && command -v npx >/dev/null 2>&1
        msg: Node.js and npx are required for Renovate validation.
    cmd: >-
      node -e '
        const actual = process.versions.node.split(".").map(Number);
        const minimum = "{{.RENOVATE_NODE_MIN_VERSION}}".split(".").map(Number);
        if (actual[0] !== minimum[0]) process.exit(1);
        for (let index = 1; index < minimum.length; index += 1) {
          if (actual[index] > minimum[index]) process.exit(0);
          if (actual[index] < minimum[index]) process.exit(1);
        }
      '
      || {
        printf '%s Found %s.\n' 'Renovate {{.RENOVATE_VERSION}} requires Node.js ^{{.RENOVATE_NODE_MIN_VERSION}}.' "$(node --version)" >&2;
        exit 1;
      }
  deps-docker:
    desc: Check Docker availability for container validation.
    run: once
    silent: true
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: Docker is required for container validation.
      - sh: docker info >/dev/null 2>&1
        msg: A running Docker daemon is required for container validation.
  deps-upgrade:
    desc: Update every managed dependency without committing or pushing changes.
    deps: [deps-upgrade:check]
    cmds:
      - task: deps-upgrade:python
      - task: deps-upgrade:ansible
      - task: deps-upgrade:pre-commit
      - task: deps-upgrade:npm
      - task: deps-upgrade:nvim
      - task: deps-upgrade:github-actions
      # Update bootstrap tool pins last so newly downloaded code is reviewed first.
      - task: deps-upgrade:repository
  deps-upgrade:check:
    desc: Check upgrade tools and GitHub authentication before refreshing pins.
    run: once
    silent: true
    deps: [deps-os]
    cmds:
      - >-
        for tool in git go npm nvim python3 timeout uv; do
          command -v "${tool}" >/dev/null 2>&1 || {
            printf '%s\n' "${tool} is required for dependency upgrades." >&2;
            exit 1;
          };
        done
      - >-
        timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
        uv sync --locked --no-build --no-install-project --no-dev --managed-python --quiet
      - >-
        timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
        uv run pre-commit --version >/dev/null
      - >-
        timeout {{.DEPENDENCY_AUTH_TIMEOUT}} python3
        .github/scripts/update_dependencies.py check
  deps-upgrade:python:
    desc: Refresh the Python lockfile and install its resolved environment.
    deps: [deps-os]
    cmds:
      - timeout {{.DEPENDENCY_COMMAND_TIMEOUT}} uv lock --upgrade
      - >-
        timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
        uv sync
        --locked
        --no-build
        --no-install-project
        --no-dev
        --managed-python
  deps-upgrade:ansible:
    desc: Refresh Ansible collection pins and install the resolved collections.
    deps: [deps-python]
    cmds:
      - >-
        timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
        uv run python .github/scripts/update_dependencies.py ansible
      - >-
        timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
        uv run ansible-galaxy collection install -r requirements.yml --upgrade
  deps-upgrade:pre-commit:
    desc: Refresh pre-commit hooks to immutable revisions.
    cmd: >-
      timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
      uv run python .github/scripts/update_dependencies.py pre-commit
  deps-upgrade:npm:
    desc: Refresh managed Codex and MCP manifests and npm lockfiles.
    cmd: >-
      timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
      uv run python .github/scripts/update_dependencies.py npm
  deps-upgrade:nvim:
    desc: Refresh the canonical Neovim lockfile in a disposable workspace.
    cmd: >-
      workspace="$(mktemp -d)";
      trap 'rm -rf -- "${workspace}"' EXIT;
      mkdir -p
      "${workspace}/home"
      "${workspace}/config"
      "${workspace}/data"
      "${workspace}/state"
      "${workspace}/cache";
      cp -a dotfiles/.config/nvim "${workspace}/config/nvim";
      printf '%s\n'
      'return { { "editorconfig/editorconfig-vim", enabled = true, lazy = true } }'
      > "${workspace}/config/nvim/lua/plugins/zz-dependency-update.lua";
      env
      HOME="${workspace}/home"
      XDG_CONFIG_HOME="${workspace}/config"
      XDG_DATA_HOME="${workspace}/data"
      XDG_STATE_HOME="${workspace}/state"
      XDG_CACHE_HOME="${workspace}/cache"
      NVIM_APPNAME=nvim
      NVIM_DOTFILES_DISABLE_PLUGINS=0
      NVIM_USE_MASON=auto
      timeout 300s nvim --headless
      '+lua dofile(".github/scripts/update_nvim.lua")';
      cp "${workspace}/config/nvim/lazy-lock.json"
      dotfiles/.config/nvim/lazy-lock.json
  deps-upgrade:github-actions:
    desc: Refresh pinned GitHub Actions with authenticated pinact.
    cmd: >-
      github_token="${PINACT_GITHUB_TOKEN:-${GITHUB_TOKEN:-}}";
      if [ -z "${github_token}" ]; then
        if ! command -v gh >/dev/null 2>&1; then
          printf '%s\n' 'GitHub authentication is required; export PINACT_GITHUB_TOKEN or GITHUB_TOKEN, or authenticate the gh CLI.' >&2;
          exit 1;
        fi;
        github_token="$(timeout {{.DEPENDENCY_AUTH_TIMEOUT}} gh auth token --hostname github.com 2>/dev/null)" || true;
        if [ -z "${github_token}" ]; then
          printf '%s\n' 'GitHub authentication is required; export PINACT_GITHUB_TOKEN or GITHUB_TOKEN, or authenticate the gh CLI.' >&2;
          exit 1;
        fi;
      fi;
      export PINACT_GITHUB_TOKEN="${github_token}" GITHUB_TOKEN="${github_token}";
      git ls-files -z --cached --others --exclude-standard
      -- '.github/workflows/*.yml' '.github/workflows/*.yaml'
      '.github/actions/**/action.yml' '.github/actions/**/action.yaml'
      | xargs -0 timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
      go run
      github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@{{.PINACT_VERSION}}
      run
      --update
      --verify-comment
  deps-upgrade:repository:
    desc: Refresh repository and CI bootstrap tool pins.
    cmd: >-
      timeout {{.DEPENDENCY_COMMAND_TIMEOUT}}
      uv run python .github/scripts/update_dependencies.py repository
  deps-report:github-actions:
    desc: Report GitHub Actions updates with a local Renovate dry run.
    deps: [deps-renovate]
    cmd: >-
      npx --yes --package renovate@{{.RENOVATE_VERSION}} renovate
      --platform=local
      --enabled=true
      --dry-run=full
      --require-config=required
      --enabled-managers=github-actions
      --include-paths='[".github/workflows/**", ".github/actions/**"]'
  update:
    desc: Fast-forward the current branch and apply user-level dotfiles.
    cmds:
      - git pull --ff-only
      - task: default

  lint:
    desc: Run ansible-lint through the locked Python environment.
    deps: [deps-python]
    cmds:
      - "uv run ansible-lint --exclude .test/"
  lint:ansible-semantics:
    desc: Validate Ansible naming and handler references.
    deps: [deps-python]
    cmd: "uv run python .test/check_ansible_semantics.py"
  lint:english:
    desc: Check repository text for the English-only contract.
    cmd: "python3 .test/check_repo_english.py"
  lint:markdown:
    desc: Lint tracked and untracked Markdown with the shared rules.
    deps: [deps-python]
    cmd: >-
      git ls-files -z --cached --others --exclude-standard -- '*.md'
      | xargs -0 uv run pre-commit run markdownlint-cli2 --files
  lint:python:
    desc: Run Ruff and Pylint on repository Python.
    deps: [deps-python]
    cmds:
      - task: pre-commit
        vars: { HOOK: ruff }
      - task: pre-commit
        vars: { HOOK: ruff-format }
      - task: pre-commit
        vars: { HOOK: pylint }
  yamllint:
    desc: Lint repository YAML through the locked Python environment.
    deps: [deps-python]
    cmd: "uv run yamllint ."
  vint:
    desc: Lint Vimscript with Neovim syntax enabled.
    deps: [deps-python]
    cmd: >-
      PYTHONWARNINGS=ignore
      uv run python .test/vint_runner.py --enable-neovim {{.VINT_TARGETS}}
  stylua:
    desc: Check Lua formatting in config and smoke fixtures.
    cmd: "stylua --check {{.STYLUA_TARGETS}}"
  docs:nvim-keymaps:
    desc: Regenerate the Neovim keymap manual.
    cmds:
      - mkdir -p docs
      - >-
        timeout 120s nvim --headless --clean -u NONE
        '+lua dofile(".test/nvim/keymap_docs.lua")'
        +qa > docs/nvim-keymaps.md
  docs:nvim-keymaps:check:
    desc: Check the generated Neovim keymap manual.
    cmds:
      - >-
        tmp="$(mktemp)";
        trap 'rm -f "${tmp}"' EXIT;
        timeout 120s nvim --headless --clean -u NONE
        '+lua dofile(".test/nvim/keymap_docs.lua")'
        +qa > "${tmp}";
        diff -u docs/nvim-keymaps.md "${tmp}"
  docs:agents:
    desc: Regenerate the nested AGENTS ownership map.
    cmds:
      - >-
        tmp="$(mktemp)";
        trap 'rm -f "${tmp}"' EXIT;
        python3 .test/gen_agents_map.py > "${tmp}";
        cp "${tmp}" AGENTS.md
  docs:agents:check:
    desc: Check the generated AGENTS ownership map.
    cmd: "python3 .test/gen_agents_map.py | diff -u AGENTS.md -"
  docs:instructions:check:
    desc: Validate command and path references in repository instructions.
    cmd: "python3 .test/check_instruction_refs.py"
  diff-check:
    desc: Check the working diff for whitespace errors.
    cmd: git diff --check
  actionlint:
    desc: Validate GitHub Actions workflows.
    cmd: actionlint .github/workflows/*.yml
  renovate:
    desc: Validate Renovate configuration with the pinned validator.
    deps: [deps-renovate]
    cmd: npx --yes --package renovate@{{.RENOVATE_VERSION}} renovate-config-validator --strict
  pre-commit:
    desc: Run all hooks on tracked and untracked repository files.
    deps: [deps-python]
    cmd: >-
      git ls-files -z --cached --others --exclude-standard
      | SKIP="${SKIP:+${SKIP},}"{{default "" .SKIP_HOOKS | shellQuote}}
      xargs -0 uv run pre-commit run {{if .HOOK}}{{.HOOK | shellQuote}}{{end}} --files
  doctor:
    desc: Report local tools and runtime availability without applying changes.
    cmd: "python3 .test/workstation_report.py doctor"
  codex:install:
    desc: Install the lockfile-resolved Codex CLI and MCP packages.
    cmds:
      - >-
        npm ci --ignore-scripts --no-audit --no-fund
        --prefix "${XDG_DATA_HOME:-$HOME/.local/share}/codex-cli/locked"
      - >-
        "${XDG_DATA_HOME:-$HOME/.local/share}/codex-cli/locked/node_modules/.bin/codex"
        --version
      - task: codex:mcp:install
  codex:mcp:install:
    desc: Install the exact lockfile-resolved MCP packages without lifecycle scripts.
    cmds:
      - >-
        npm ci --ignore-scripts --no-audit --no-fund
        --prefix "${XDG_DATA_HOME:-$HOME/.local/share}/codex-mcp/context7"
      - >-
        npm ci --ignore-scripts --no-audit --no-fund
        --prefix "${XDG_DATA_HOME:-$HOME/.local/share}/codex-mcp/playwright"
  dotfiles:plan:
    desc: Report user-level mappings and cleanup paths without applying changes.
    cmd: "python3 .test/workstation_report.py dotfiles-plan"
  system:report:
    desc: Report managed system paths and local services without applying changes.
    cmd: "python3 .test/workstation_report.py system-report"
  browser-policies:report:
    desc: Report policy paths and installed applications without applying changes.
    cmd: "python3 .test/workstation_report.py browser-policies-report"
  managed-paths:check:
    desc: Check documentation and reports against managed paths.
    deps: [deps-python]
    cmd: >-
      manifest="$(mktemp)";
      trap 'rm -f "${manifest}"' EXIT;
      uv run ansible-playbook .test/managed_paths.yml -e manifest_out="${manifest}" >/dev/null;
      python3 .test/check_managed_paths.py "${manifest}"
  test:contracts:
    desc: Validate role input contracts without applying the workstation.
    deps: [deps-galaxy]
    cmd: "uv run ansible-playbook .test/role_contracts.yml"
  test:agent-tooling:
    desc: Validate managed Codex configs, dependency locks, and hook behavior.
    deps: [deps-python]
    cmd: >-
      uv run pytest .test/test_agent_tooling.py .test/test_portable_hook.py {{.CLI_ARGS}}
  test:python:
    desc: Run repository Python contract and regression tests.
    deps: [deps-python]
    cmd: "uv run pytest {{.CLI_ARGS}}"
  ci:static:
    desc: Run cheap shared checks without Neovim, Docker, or host writes.
    cmds:
      - task: diff-check
      - task: lint:english
      - task: docs:agents:check
      - task: docs:instructions:check
      - task: pre-commit
        vars:
          SKIP_HOOKS: stylua
      - task: test:python
      - task: lint:ansible-semantics
      - task: vint
      - task: managed-paths:check
      - task: lint
      - task: test:contracts
  verify:fast:
    desc: Run static validation without Docker or managed-host writes.
    cmds:
      - task: ci:static
      - task: deps-verify
      - task: stylua
      - task: docs:nvim-keymaps:check
      - task: renovate

  verify:
    desc: Run static, Neovim, and Docker validation without applying the host.
    cmds:
      - task: verify:fast
      - task: test:nvim:all
      - task: test:system
      - task: superlinter
  superlinter:
    desc: Run the pinned Super-Linter image in Docker.
    deps: [deps-docker]
    cmd: >-
      set --
      --rm
      --env-file .github/super-linter.env
      -e LOG_LEVEL=ERROR
      -e RUFF_CACHE_DIR=/tmp/ruff-cache
      -e RUN_LOCAL=true
      -e USE_FIND_ALGORITHM=true
      -e VALIDATE_ALL_CODEBASE=true
      -v "${PWD}:/tmp/lint";
      if [ -f .test/system/local.env ]; then
        set -- "$@" -v "${PWD}/.test/system/local.env.example:/tmp/lint/.test/system/local.env:ro";
      fi;
      docker run "$@" ghcr.io/super-linter/super-linter:{{.SUPERLINTER_IMAGE_TAG}}
  superlinter:latest:
    desc: Run the latest slim Super-Linter image in Docker.
    cmds:
      - task: superlinter
        vars:
          SUPERLINTER_IMAGE_TAG: "slim-latest"
  clear:
    desc: Remove local Ansible, collection, Task, and Python caches.
    cmd: >-
      rm -rf
      .ansible
      .collections
      .task
      .venv
  default:
    desc: Apply user-level dotfiles only, without sudo.
    deps: [deps-galaxy]
    cmd: "{{.RUN_PLAYBOOK}}"
  all:
    desc: Apply user dotfiles, privileged system configuration, and policies in order.
    cmds:
      - task: default
      - task: system
      - task: browser-policies
  dotfiles:check:
    desc: Dry-run user-level dotfiles with diff output.
    deps: [deps-galaxy]
    cmd: "{{.RUN_PLAYBOOK}} --check --diff"
  system:
    desc: Apply the opt-in privileged Arch workstation configuration.
    deps: [deps-galaxy]
    cmds:
      - task: deps-os-system
      - "{{.RUN_SYSTEM_PLAYBOOK}}"
  system:check:
    desc: Dry-run the opt-in privileged Arch workstation configuration.
    deps: [deps-galaxy]
    cmds:
      - task: deps-os-system
      - "{{.RUN_SYSTEM_PLAYBOOK}} --check"
  system:list:
    desc: List tasks in the system playbook.
    deps: [deps-python]
    cmd: "uv run ansible-playbook --list-tasks playbook_system.yml"
  pacdiff:
    desc: List pending pacman pacnew and pacsave files.
    cmd: >-
      type -P pacdiff >/dev/null
      || {
        printf '%s\n' 'pacdiff is missing; run go-task system first or install pacman-contrib.';
        exit 1;
      };
      pacdiff -o
  browser-policies:
    desc: Apply opt-in privileged application policy files.
    deps: [deps-galaxy]
    cmd: "{{.RUN_BROWSER_PLAYBOOK}} {{.CLI_ARGS}}"
  browser-policies:check:
    desc: Dry-run privileged application policy management.
    deps: [deps-galaxy]
    cmd: "{{.RUN_BROWSER_PLAYBOOK}} --check --diff {{.CLI_ARGS}}"
  test:nvim:
    desc: Run the isolated Neovim smoke test.
    cmds:
      - task: nvim:prepare
      - >-
        {{.NVIM_SMOKE_ENV}}
        NVIM_DOTFILES_RESTORE=1
        timeout 300s nvim --headless "+lua require('config.restore').run()" +cquit
      - diff -u dotfiles/.config/nvim/lazy-lock.json .test/nvim/.config/nvim/lazy-lock.json
      - >-
        {{.NVIM_TEST_ENV}}
        timeout 120s nvim --headless --clean -u NONE
        '+lua dofile(".test/nvim/restore.lua")'
      - >-
        {{.NVIM_SMOKE_ENV}}
        timeout 120s nvim --headless
        .test/nvim/vimwiki/index.wiki
        "+lua dofile('.test/nvim/vimwiki_first_buffer.lua')"
      - task: test:nvim:mason-tools
      - >-
        {{.NVIM_SMOKE_ENV}}
        timeout 180s nvim --headless "+lua dofile('.test/nvim/treesitter_install.lua')" +qa
      - >-
        {{.NVIM_SMOKE_ENV}}
        timeout 120s nvim --headless "+checkhealth" +qa
      - >-
        {{.NVIM_SMOKE_ENV}}
        timeout 120s nvim --headless "+checkhealth vim.lsp" +qa
      - >-
        {{.NVIM_SMOKE_ENV}}
        timeout 120s nvim --headless "+lua dofile('.test/nvim/smoke.lua')"
  test:nvim:mason-tools:
    desc: Validate the configured Mason tool registry.
    cmds:
      - >-
        {{.NVIM_TEST_ENV}}
        timeout 120s nvim --headless --clean -u NONE
        '+lua dofile(".test/nvim/mason_tools.lua")'
  test:nvim:compat:
    desc: Run Neovim compatibility checks without plugins.
    cmds:
      - task: nvim:prepare
      - >-
        {{.NVIM_TEST_ENV}}
        NVIM_DOTFILES_DISABLE_PLUGINS=1
        timeout 60s nvim --headless "+lua dofile('.test/nvim/compat.lua')"
  test:nvim:all:
    desc: Run Neovim smoke and compatibility checks in order.
    cmds:
      - task: test:nvim
      - task: test:nvim:compat
  test:nvim:profile:
    desc: Run Neovim smoke tests and report startup metrics.
    deps: [test:nvim]
    cmds:
      - >-
        profile_log="$(mktemp)";
        trap 'rm -f "${profile_log}"' EXIT;
        {{.NVIM_TEST_ENV}}
        timeout 120s nvim --headless --startuptime "${profile_log}" +qa >/dev/null 2>&1;
        awk '/--- NVIM STARTED ---/ { printf "startup_ms=%s\n", $1 }' "${profile_log}"
      - >-
        {{.NVIM_TEST_ENV}}
        timeout 120s nvim --headless
        '+lua local cfg=require("lazy.core.config"); local names={}; local total=0; for name,p in pairs(cfg.plugins) do total=total+1; if p._ and p._.loaded then table.insert(names,name) end end; table.sort(names); print("plugins_total=" .. total); print("plugins_loaded=" .. #names); print("loaded_plugins=" .. table.concat(names,","))'
        +qa
  nvim:prepare:
    internal: true
    cmds:
      - >-
        rm -rf
        .test/nvim/.config/nvim
        .test/nvim/.data/nvim
        .test/nvim/.state/nvim
        .test/nvim/.cache/nvim
        .test/nvim/.home
      - >-
        mkdir -p
        .test/nvim/.config
        .test/nvim/.data
        .test/nvim/.state
        .test/nvim/.cache
        .test/nvim/.home
      - cp -a dotfiles/.config/nvim .test/nvim/.config/
  test:system:
    desc: Validate package targets and convergence in a disposable Arch container.
    deps: [deps-docker]
    cmd: >-
      test_env_file="${DOTFILES_TEST_ENV_FILE:-.test/system/local.env}";
      if [ -z "${DOTFILES_TEST_ENV_FILE:-}" ] && [ ! -f "${test_env_file}" ]; then
        test_env_file=/dev/null;
      fi;
      docker run --pull always --rm -i
      --env-file "${test_env_file}"
      -v "$(pwd):/.dotfiles:ro"
      archlinux:multilib-devel
      bash -c 'cd .dotfiles && ./.test/system/exec.sh'
