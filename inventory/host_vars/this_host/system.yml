---
ansible_managed: o_O
system_aur_enabled: true
system_timezone: Europe/Warsaw
system_motd_message: o_O
system_laptop_enabled: true
system_tuned_enabled: true
system_fstrim_enabled: true
# Intel P-state active mode retains workload-dependent frequency scaling.
system_tuned_performance_governor: powersave
system_tuned_performance_energy_preference: performance
system_tuned_performance_platform_profile: performance

system_journald_settings:
  Storage: persistent
  Compress: "yes"
  SystemMaxUse: 50M
