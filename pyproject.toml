[project]
requires-python = ">=3.14"
name = "dotfiles"
version = "2.4.1"
dependencies = [
    "ansible",
    "ansible-lint",
    "pre-commit",
    "pylint",
    "pytest",
    "pyyaml",
    "ruff",
    "yamllint",
    "vim-vint",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [".test"]
pythonpath = [".test", ".github/scripts"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
norecursedirs = ["nvim", "system"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
