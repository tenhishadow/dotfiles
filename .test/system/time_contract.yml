---
- name: Container Time Test | Verify preventative service masking
  hosts: this_host
  gather_facts: true
  vars_files:
    - ../../roles/system/defaults/main.yml
    - ../../roles/system/vars/archlinux.yml
  vars:
    system_time_conflicting_services:
      - dotfiles-absent-ntpd.service
    system_time_contract_config_path: /tmp/dotfiles-chrony.conf
    system_time_contract_fake_systemctl: /tmp/systemctl
    system_time_contract_masked_service: dotfiles-masked-running.service
    system_time_contract_negative_tests: true
    system_time_contract_stop_marker: /tmp/dotfiles-time-contract-stop
    system_time_contract_foreign_link: >-
      /etc/systemd/system/dotfiles-foreign-link.service
    system_time_contract_foreign_link_target: >-
      /tmp/dotfiles-foreign-time-unit.service
    system_time_contract_foreign_unit: >-
      /etc/systemd/system/dotfiles-foreign-unit.service
    system_time_contract_expected_lines:
      - pool 0.example.invalid iburst maxsources 2
      - pool 1.example.invalid iburst maxsources 2
      - driftfile /tmp/dotfiles-chrony.drift
      - makestep 0.75 -1
      - maxupdateskew 75
      - rtcsync
      - leapsectz UTC
  tasks:
    - name: Container Time Test | Require container isolation
      ansible.builtin.assert:
        that:
          - >-
            'container' in (ansible_facts.virtualization_tech_guest | default([]))
            or (
              (ansible_facts.virtualization_type | default('') | lower)
              in system_container_virtualization_types
            )
        fail_msg: "Time service mutation tests require a disposable container."
        quiet: true

    - name: Container Time Test | Gather service facts
      ansible.builtin.service_facts:

    - name: Container Time Test | Run conflicting service tasks
      ansible.builtin.include_role:
        name: system
        tasks_from: time-conflicts

    - name: Container Time Test | Inspect preventative mask
      ansible.builtin.stat:
        path: /etc/systemd/system/dotfiles-absent-ntpd.service
        follow: false
      register: system_time_contract_mask

    - name: Container Time Test | Verify preventative mask
      ansible.builtin.assert:
        that:
          - system_time_contract_mask.stat.islnk | default(false)
          - system_time_contract_mask.stat.lnk_source == '/dev/null'
        fail_msg: >-
          The time conflict task did not mask a service that was absent before
          the role ran.
        quiet: true

    - name: Container Time Test | Install fake systemctl
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          set -eu

          case "${1:-}" in
            show)
              printf '%s\n' 'LoadState=masked' 'ActiveState=active'
              ;;
            stop)
              : > "{{ system_time_contract_stop_marker }}"
              ;;
            *)
              printf 'Unexpected fake systemctl command: %s\n' "$*" >&2
              exit 2
              ;;
          esac
        dest: "{{ system_time_contract_fake_systemctl }}"
        owner: root
        group: root
        mode: "0755"
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Create fake masked running service
      ansible.builtin.file:
        src: /dev/null
        dest: >-
          {{ system_systemd_system_unit_dir }}/{{
            system_time_contract_masked_service
          }}
        state: link
        force: false
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Reset masked service stop marker
      ansible.builtin.file:
        path: "{{ system_time_contract_stop_marker }}"
        state: absent
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Stop fake masked running service
      ansible.builtin.include_role:
        name: system
        tasks_from: time-conflicts
        apply:
          environment:
            PATH: /tmp:/usr/local/sbin:/usr/local/bin:/usr/bin
      vars:
        ansible_facts:
          services:
            dotfiles-masked-running.service:
              name: dotfiles-masked-running.service
              source: systemd
              state: running
              status: masked
        system_time_conflicting_services:
          - "{{ system_time_contract_masked_service }}"
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Inspect masked service stop marker
      ansible.builtin.stat:
        path: "{{ system_time_contract_stop_marker }}"
      register: system_time_contract_stop_marker_state
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Verify masked service was stopped
      ansible.builtin.assert:
        that:
          - system_time_contract_stop_marker_state.stat.isreg | default(false)
        fail_msg: "A running masked time service was not stopped."
        quiet: true
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Create unmanaged unit override
      ansible.builtin.copy:
        content: "foreign-unit-preserved\n"
        dest: "{{ system_time_contract_foreign_unit }}"
        owner: root
        group: root
        mode: "0644"
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Exercise unmanaged unit rejection
      when: system_time_contract_negative_tests | bool
      block:
        - name: Container Time Test | Reset unit rejection result
          ansible.builtin.set_fact:
            system_time_contract_unit_rejected: false

        - name: Container Time Test | Run tasks against unmanaged unit
          ansible.builtin.include_role:
            name: system
            tasks_from: time-conflicts
          vars:
            system_time_conflicting_services:
              - dotfiles-foreign-unit.service
      rescue:
        - name: Container Time Test | Record unit rejection
          ansible.builtin.set_fact:
            system_time_contract_unit_rejected: >-
              {{
                'Refusing to replace unmanaged systemd unit override'
                in (ansible_failed_result | string)
              }}

    - name: Container Time Test | Inspect preserved unit override
      ansible.builtin.stat:
        path: "{{ system_time_contract_foreign_unit }}"
        follow: false
        checksum_algorithm: sha256
      register: system_time_contract_foreign_unit_state
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Verify unmanaged unit rejection
      ansible.builtin.assert:
        that:
          - system_time_contract_unit_rejected | bool
          - system_time_contract_foreign_unit_state.stat.isreg | default(false)
          - >-
            system_time_contract_foreign_unit_state.stat.checksum
            == '0d333c425b086e523e0d1bdd86de3c89d28b8fe3248ecfe223330b0bc6d995b0'
        fail_msg: >-
          The time conflict task did not reject and preserve an unmanaged unit
          override.
        quiet: true
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Create foreign link target
      ansible.builtin.copy:
        content: "foreign-link-target\n"
        dest: "{{ system_time_contract_foreign_link_target }}"
        owner: root
        group: root
        mode: "0644"
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Create unmanaged unit symlink
      ansible.builtin.file:
        src: "{{ system_time_contract_foreign_link_target }}"
        dest: "{{ system_time_contract_foreign_link }}"
        state: link
        force: false
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Exercise unmanaged symlink rejection
      when: system_time_contract_negative_tests | bool
      block:
        - name: Container Time Test | Reset symlink rejection result
          ansible.builtin.set_fact:
            system_time_contract_symlink_rejected: false

        - name: Container Time Test | Run tasks against unmanaged symlink
          ansible.builtin.include_role:
            name: system
            tasks_from: time-conflicts
          vars:
            system_time_conflicting_services:
              - dotfiles-foreign-link.service
      rescue:
        - name: Container Time Test | Record symlink rejection
          ansible.builtin.set_fact:
            system_time_contract_symlink_rejected: >-
              {{
                'Refusing to replace unmanaged systemd unit override'
                in (ansible_failed_result | string)
              }}

    - name: Container Time Test | Inspect preserved unit symlink
      ansible.builtin.stat:
        path: "{{ system_time_contract_foreign_link }}"
        follow: false
      register: system_time_contract_foreign_link_state
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Verify unmanaged symlink rejection
      ansible.builtin.assert:
        that:
          - system_time_contract_symlink_rejected | bool
          - system_time_contract_foreign_link_state.stat.islnk | default(false)
          - >-
            system_time_contract_foreign_link_state.stat.lnk_source
            == system_time_contract_foreign_link_target
        fail_msg: >-
          The time conflict task did not reject and preserve an unmanaged unit
          symlink.
        quiet: true
      when: system_time_contract_negative_tests | bool

    - name: Container Time Test | Render validated Chrony configuration
      ansible.builtin.template:
        src: ../../roles/system/templates/chrony.conf.j2
        dest: "{{ system_time_contract_config_path }}"
        owner: root
        group: root
        mode: "0600"
        validate: "{{ system_chrony_binary_path }} -p -f %s"
      # Task vars override the role defaults loaded by vars_files above.
      vars:
        system_ntp_servers: [0.example.invalid, 1.example.invalid]
        system_chrony_pool_max_sources: 2
        system_chrony_makestep_threshold: 0.75
        system_chrony_makestep_limit: -1
        system_chrony_max_update_skew: 75
        system_chrony_drift_path: /tmp/dotfiles-chrony.drift
        system_chrony_leap_timezone: UTC

    - name: Container Time Test | Read rendered Chrony configuration
      ansible.builtin.slurp:
        src: "{{ system_time_contract_config_path }}"
      register: system_time_contract_config_content

    - name: Container Time Test | Verify rendered Chrony settings
      ansible.builtin.assert:
        that:
          - >-
            (
              (system_time_contract_config_content.content | b64decode).splitlines()
              | map('trim') | reject('match', '^(#|$)') | sort
            ) == (system_time_contract_expected_lines | sort)
        fail_msg: >-
          Chrony configuration did not preserve the supplied non-default settings.
        quiet: true
