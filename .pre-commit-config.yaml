# Pre-commit hooks configuration
# Run: go-task pre-commit
minimum_pre_commit_version: "4.4.0"
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["--config", ".github/linters/.codespellrc"]
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", "dotfiles/.yamllint"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ["-x"]
  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: dotfiles/.config/nvim/lazy-lock.json
        # Frozen upstream revisions are public commit IDs, not credentials.
        args:
          - --exclude-lines
          - '^\s*rev: "?[0-9a-f]{40}"?\s+# frozen: v?[0-9][0-9A-Za-z.+-]*$'
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: ["-c", ".zizmor.yml"]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint (locked uv environment)
        entry: uv run --locked ruff check
        language: unsupported
        require_serial: true
        types_or: [python, pyi]
        exclude: ^\.test/nvim/
      - id: ruff-format
        name: Ruff format (locked uv environment)
        entry: uv run --locked ruff format --check
        language: unsupported
        require_serial: true
        types_or: [python, pyi]
        exclude: ^\.test/nvim/
      - id: pylint
        name: Pylint (locked uv environment)
        entry: uv run --locked pylint --rcfile=.github/linters/.python-lint
        language: unsupported
        require_serial: true
        types: [python]
        exclude: ^\.test/nvim/
      - id: stylua
        name: stylua
        entry: stylua --check
        language: unsupported
        files: ^(dotfiles/\.config/nvim|\.test/nvim|\.github/scripts)/.*\.lua$
